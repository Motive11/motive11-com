<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book a time, Motive11</title>
<meta name="description" content="Book a time with Mark at Motive11." />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#1E1E1F" />

<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />

<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">

<!-- Fathom Analytics (motive11.com). Source of truth is AIOS site_traffic; see
     pipelines/site-analytics. -->
<script src="https://cdn.usefathom.com/script.js" data-excluded-domains="localhost,127.0.0.1" data-site="UYCRGPKV" defer></script>

<!-- A port of the booking flow on markszymanski.co (src/components/BookingFlow.astro in that repo),
     talking to the same AIOS booking Worker (state/booking-worker). This site has no build step, so
     it is a copy: a fix to the flow there belongs here too. Payment is left out on purpose, because
     no Motive11 type takes a card; a priced type shows "opens soon" instead. -->
<style>
  :root {
    --bg: #1E1E1F;
    --fg: #F4F3EF;
    --fg-dim: rgba(244, 243, 239, 0.55);
    --fg-faint: rgba(244, 243, 239, 0.18);
    --orange: #FF6A1A;
    --sans: "Satoshi", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

    --color-ink: var(--fg);
    --color-paper: var(--bg);
    --color-surface: #252527;
    --color-border: rgba(244, 243, 239, 0.14);
    --color-muted: rgba(244, 243, 239, 0.6);
    --color-accent: var(--orange);
    --color-accent-hover: #FF8240;
    --radius-sm: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* The flow hides parts with the hidden attribute, and a display rule on the same element would
     otherwise win over it. */
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    opacity: 0.05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  button:disabled { cursor: default; }
  ul { list-style: none; }

  .top { display: flex; justify-content: center; padding: 1.75rem 1rem 0.5rem; position: relative; z-index: 1; }
  .top img { height: 22px; width: auto; opacity: 0.85; display: block; }
  .top a:hover img { opacity: 1; }
  main { flex: 1; position: relative; z-index: 1; }
  .foot { display: flex; gap: 14px; justify-content: center; padding: 1.5rem 1rem 2rem; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--fg-faint); font-weight: 500; position: relative; z-index: 1; }
  .foot a { color: var(--fg-dim); text-decoration: none; }
  .foot a:hover { color: var(--orange); }
  a { color: var(--orange); }

  .bk { padding: 2rem 1rem 3rem; color-scheme: dark; }
  .bk-card {
    max-width: 1060px; margin: 0 auto; background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-sm); display: grid; grid-template-columns: minmax(240px, 330px) 1fr; overflow: hidden;
  }
  .bk select option { background: var(--color-surface); color: var(--color-ink); }
  .bk select optgroup { background: var(--color-surface); color: var(--color-muted); font-style: normal; font-weight: 600; }
  .bk-info { padding: 2rem 1.75rem; border-right: 1px solid var(--color-border); }
  .bk-photo { width: 88px; height: 88px; border-radius: 999px; object-fit: cover; object-position: 50% 20%; }
  .bk-host { margin-top: 1rem; color: var(--color-muted); font-weight: 500; }
  .bk-title { font-size: 1.75rem; line-height: 1.15; font-weight: 900; letter-spacing: -0.02em; margin: 0.25rem 0 1rem; }
  .bk-meta { display: grid; gap: 0.5rem; color: var(--color-muted); font-weight: 500; margin-bottom: 1rem; }
  .bk-desc { color: var(--color-ink); line-height: 1.6; }
  .bk-desc p { margin: 0 0 0.9rem; }
  .bk-desc h3 { font-weight: 700; margin: 1.25rem 0 0.4rem; }
  .bk-desc ul { margin: 0 0 0.9rem; padding-left: 1.1rem; list-style: disc; }
  .bk-desc li { margin: 0.2rem 0; }
  .bk-picked { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--color-border); font-weight: 700; }
  .bk-picked p { margin-bottom: 0.75rem; }
  .bk-picked span { color: var(--color-muted); font-weight: 500; }
  .bk-main { padding: 2rem 1.75rem; min-height: 520px; }
  .bk-h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 1.5rem; letter-spacing: -0.01em; }
  .bk-pick { display: grid; grid-template-columns: 1fr 260px; gap: 2rem; align-items: start; }
  .bk-month { display: flex; align-items: center; justify-content: center; gap: 1.5rem; font-weight: 700; margin-bottom: 1rem; }
  .bk-nav { width: 2.25rem; height: 2.25rem; border-radius: 999px; font-size: 1.5rem; line-height: 1; color: var(--color-accent); }
  .bk-nav:hover:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
  .bk-nav:disabled { color: var(--color-border); }
  .bk-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.35rem; text-align: center; }
  .bk-dow span { font-size: 0.75rem; font-weight: 500; color: var(--color-muted); text-transform: uppercase; letter-spacing: 0.08em; padding-bottom: 0.5rem; }
  .bk-d { aspect-ratio: 1; max-width: 2.9rem; width: 100%; margin: 0 auto; border-radius: 999px; font-size: 0.95rem; color: var(--color-muted); position: relative; }
  .bk-d.is-open { background: color-mix(in srgb, var(--color-accent) 12%, transparent); color: var(--color-accent); font-weight: 700; cursor: pointer; }
  .bk-d.is-open:hover { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }
  .bk-d.is-sel { background: var(--color-accent); color: var(--color-paper); }
  .bk-d.is-today::after { content: ""; position: absolute; bottom: 0.3rem; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 999px; background: currentColor; }
  .bk-tzrow { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 0.75rem 1.25rem; margin-top: 1.5rem; }
  .bk-tzlock { font-weight: 500; color: var(--color-muted); }
  .bk-tz { display: grid; gap: 0.35rem; font-weight: 700; font-size: 0.9rem; min-width: 0; }
  /* A select is always as wide as its longest option, which parks the arrow far from the text, so
     the chosen zone is shown as text with the arrow beside it and the real select laid over it. */
  .bk-tzpick { position: relative; display: inline-flex; align-items: center; gap: 0.4rem; justify-self: start; max-width: 100%; padding: 0.4rem 0; font-weight: 500; cursor: pointer; }
  .bk-tzpick [data-el="tzlabel"] { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bk-tzpick select { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; font-size: 1rem; }
  .bk-tzpick:focus-within { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: var(--radius-sm); }
  .bk-clock { display: inline-flex; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 2px; font-size: 0.8rem; font-weight: 700; }
  .bk-clock button { padding: 0.3rem 0.7rem; border-radius: calc(var(--radius-sm) - 1px); color: var(--color-muted); }
  .bk-clock button.is-on { background: var(--color-ink); color: var(--color-paper); }
  .bk-footnote { margin-top: 1rem; font-size: 0.8rem; color: var(--color-muted); }
  .bk-sk { display: block; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--color-ink) 7%, transparent); }
  .bk.is-loading .bk-sk { animation: bk-pulse 1.2s ease-in-out infinite; }
  .bk-sk-d { aspect-ratio: 1; max-width: 2.9rem; width: 100%; margin: 0 auto; border-radius: 999px; }
  .bk-sk-t { height: 2.9rem; }
  .bk-sk-line { height: 1.1rem; width: 70%; }
  .bk-sk-card { height: 5.25rem; }
  @keyframes bk-pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .bk.is-loading .bk-sk { animation: none; } }
  .bk-day { font-weight: 500; margin-bottom: 1rem; }
  .bk-time-list { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .bk-time, .bk-next { padding: 0.75rem 0; border-radius: var(--radius-sm); font-size: 0.875rem; }
  .bk-time { font-weight: 700; border: 1px solid color-mix(in srgb, var(--color-accent) 55%, transparent); color: var(--color-accent); }
  .bk-time:hover { border-color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
  .bk-time.is-armed { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-paper); box-shadow: none; }
  .bk-next { grid-column: 1 / -1; font-weight: 700; background: var(--color-accent); color: var(--color-paper); }
  .bk-next, .bk-btn { text-transform: capitalize; }
  .bk-next:hover, .bk-btn:hover { background: var(--color-accent-hover); }
  .bk-durations { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
  .bk-dur { padding: 0.45rem 0.9rem; border-radius: var(--radius-sm); border: 1px solid var(--color-border); font-weight: 700; }
  .bk-dur.is-sel { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-paper); }
  .bk-status { color: var(--color-muted); margin-top: 1rem; }
  .bk-status:empty { display: none; }
  .bk-tray { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--color-border); display: grid; gap: 0.75rem; }
  .bk-chip { display: flex; justify-content: space-between; gap: 1rem; padding: 0.6rem 0.9rem; border-radius: var(--radius-sm); background: var(--color-paper); font-weight: 700; margin-bottom: 0.5rem; }
  .bk-chip button { font-size: 1.2rem; line-height: 1; color: var(--color-muted); }
  .bk-btn { justify-self: start; background: var(--color-accent); color: var(--color-paper); font-weight: 700; font-size: 0.875rem; padding: 0.75rem 2rem; border-radius: var(--radius-sm); transition: background-color .15s; }
  .bk-btn:disabled { opacity: 0.6; }
  .bk-back { color: var(--color-accent); font-weight: 700; margin-bottom: 1rem; }
  .bk-field { display: grid; gap: 0.4rem; margin-bottom: 1.1rem; font-weight: 700; max-width: 520px; }
  .bk-field input, .bk-field textarea, .bk-field select { font-weight: 400; border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 0.75rem 1rem; background: var(--color-paper); color: var(--color-ink); font-size: 0.875rem; }
  .bk-field input:focus, .bk-field textarea:focus, .bk-field select:focus { outline: none; border-color: var(--color-accent); }
  .bk-names { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; max-width: 520px; }
  @media (max-width: 480px) { .bk-names { grid-template-columns: 1fr; } }
  .bk-hp { position: absolute; left: -9999px; }
  .bk-error { color: var(--color-accent); font-weight: 700; margin-bottom: 1rem; }
  .bk-done-text { line-height: 1.6; margin-bottom: 1rem; color: var(--color-muted); }
  .bk-done-text strong { color: var(--color-ink); }
  .bk-done-list, .bk-manage-list { display: grid; gap: 0.6rem; font-weight: 700; }
  .bk-mrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.75rem; padding: 0.9rem 1rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
  .bk-mact { display: flex; gap: 1rem; }
  .bk-link { color: var(--color-accent); font-weight: 700; }
  .bk-types { display: grid; gap: 0.75rem; }
  .bk-type { display: block; padding: 1.1rem 1.25rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: inherit; text-decoration: none; transition: border-color .15s, background-color .15s; }
  .bk-type:hover, .bk-type:focus-visible { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 5%, transparent); outline: none; }
  .bk-type-name { display: flex; justify-content: space-between; gap: 1rem; font-weight: 700; font-size: 1.05rem; }
  .bk-type-name::after { content: "→"; color: var(--color-accent); }
  .bk-type-meta { display: block; color: var(--color-muted); font-size: 0.85rem; margin-top: 0.2rem; }
  .bk-type-desc { display: block; color: var(--color-muted); font-size: 0.9rem; line-height: 1.5; margin-top: 0.6rem; }
  @media (max-width: 860px) {
    .bk-card { grid-template-columns: 1fr; }
    .bk-info { border-right: 0; border-bottom: 1px solid var(--color-border); padding: 1.5rem 1.25rem; }
    .bk-main { padding: 1.5rem 1.25rem; min-height: 0; }
    .bk-pick { grid-template-columns: 1fr; gap: 1.5rem; }
    .bk-time-list { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="top">
  <a href="/" aria-label="Motive11 home"><img src="/images/logo-light.svg" alt="Motive11" /></a>
</header>

<main>
<div class="bk bk-full is-loading" data-api="https://book.motive11.com" data-sitekey="0x4AAAAAACLfBNly9hNWKoDK">
  <div class="bk-card">
    <aside class="bk-info">
      <img class="bk-photo" src="/images/mark-szymanski.webp" alt="Mark Szymanski" width="88" height="88" />
      <p class="bk-host">Mark Szymanski</p>
      <h1 class="bk-title" data-el="title">&nbsp;</h1>
      <ul class="bk-meta">
        <li data-el="duration" hidden></li>
        <li data-el="location" hidden></li>
        <li data-el="left" hidden></li>
      </ul>
      <div class="bk-desc" data-el="desc"></div>
      <div class="bk-picked" data-el="picked" hidden></div>
    </aside>

    <section class="bk-main">
      <div data-step="pick">
        <h2 class="bk-h2">Select a Date &amp; Time</h2>
        <div class="bk-durations" data-el="durations" hidden></div>
        <div class="bk-pick">
          <div class="bk-cal">
            <div class="bk-month">
              <button type="button" class="bk-nav" data-act="prev" aria-label="Previous month">&#8249;</button>
              <span data-el="month"></span>
              <button type="button" class="bk-nav" data-act="next" aria-label="Next month">&#8250;</button>
            </div>
            <div class="bk-grid bk-dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
            <div class="bk-grid" data-el="days"></div>
            <p class="bk-status" data-el="status"></p>
            <div class="bk-tzrow">
              <p class="bk-tz bk-tzlock" data-el="tzlock" hidden></p>
              <label class="bk-tz" data-el="tzpicker">
                <span>Time zone</span>
                <span class="bk-tzpick">
                  <span data-el="tzlabel"></span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  <select data-el="tz" aria-label="Time zone"></select>
                </span>
              </label>
              <div class="bk-clock" role="group" aria-label="Clock format">
                <button type="button" data-clock="12">am/pm</button><button type="button" data-clock="24">24h</button>
              </div>
            </div>
          </div>
          <div class="bk-times" data-el="times-wrap">
            <p class="bk-day" data-el="day"><span class="bk-sk bk-sk-line"></span></p>
            <div class="bk-time-list" data-el="times"></div>
          </div>
        </div>
        <div class="bk-tray" data-el="tray" hidden>
          <div data-el="tray-list"></div>
          <button type="button" class="bk-btn" data-act="to-details">Next</button>
        </div>
      </div>

      <form data-step="details" hidden novalidate>
        <button type="button" class="bk-back" data-act="back">&#8249; Back</button>
        <h2 class="bk-h2">Enter Details</h2>
        <div class="bk-names">
          <label class="bk-field"><span>First name *</span><input name="first" autocomplete="given-name" required /></label>
          <label class="bk-field"><span>Last name *</span><input name="last" autocomplete="family-name" required /></label>
        </div>
        <label class="bk-field"><span>Email *</span><input name="email" type="email" autocomplete="email" required /></label>
        <div data-el="questions"></div>
        <input name="website" class="bk-hp" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <div class="bk-field bk-ts" data-el="turnstile"></div>
        <p class="bk-error" data-el="error" hidden></p>
        <button type="submit" class="bk-btn" data-el="submit">Confirm booking</button>
        <p class="bk-footnote" data-el="footnote" hidden></p>
      </form>

      <div data-step="done" hidden>
        <h2 class="bk-h2" data-el="done-title">See you then.</h2>
        <p class="bk-done-text" data-el="done-text">A calendar invite with the details is on its way to <strong data-el="done-email"></strong>.</p>
        <ul class="bk-done-list" data-el="done-list"></ul>
      </div>

      <div data-step="manage" hidden>
        <h2 class="bk-h2">Your booking</h2>
        <ul class="bk-manage-list" data-el="manage-list"></ul>
        <p class="bk-status" data-el="manage-status"></p>
      </div>

      <div data-step="list" hidden>
        <h2 class="bk-h2">Pick a meeting</h2>
        <ul class="bk-types" data-el="types"><li><span class="bk-sk bk-sk-card"></span></li><li><span class="bk-sk bk-sk-card"></span></li></ul>
      </div>

      <div data-step="missing" hidden>
        <h2 class="bk-h2" data-el="missing-title">This link isn't active.</h2>
        <p class="bk-done-text" data-el="missing-text">It may have been used up or switched off.</p>
      </div>
    </section>
  </div>
</div>
</main>

<footer class="foot">
  <span>Motive11, LLC</span>
  <a href="/terms">Terms</a>
</footer>

<script>
(() => {
  const ZONE_GROUPS = [
    ["US and Canada", ["America/New_York", "America/Chicago", "America/Denver", "America/Phoenix", "America/Los_Angeles",
      "America/Anchorage", "Pacific/Honolulu", "America/Halifax", "America/St_Johns"]],
    ["Latin America", ["America/Mexico_City", "America/Bogota", "America/Lima", "America/Santiago", "America/Argentina/Buenos_Aires", "America/Sao_Paulo"]],
    ["Europe and Africa", ["Europe/London", "Europe/Dublin", "Europe/Lisbon", "Europe/Paris", "Europe/Berlin", "Europe/Madrid", "Europe/Rome",
      "Europe/Amsterdam", "Europe/Stockholm", "Europe/Warsaw", "Europe/Athens", "Europe/Istanbul", "Europe/Moscow",
      "Africa/Lagos", "Africa/Cairo", "Africa/Johannesburg", "Africa/Nairobi"]],
    ["Asia and the Middle East", ["Asia/Dubai", "Asia/Karachi", "Asia/Kolkata", "Asia/Dhaka", "Asia/Bangkok", "Asia/Jakarta",
      "Asia/Singapore", "Asia/Manila", "Asia/Hong_Kong", "Asia/Shanghai", "Asia/Tokyo", "Asia/Seoul"]],
    ["Australia and the Pacific", ["Australia/Perth", "Australia/Adelaide", "Australia/Brisbane", "Australia/Sydney", "Pacific/Auckland"]],
  ];
  const zoneName = (z) => {
    let generic = "";
    try { generic = new Intl.DateTimeFormat("en-US", { timeZone: z, timeZoneName: "longGeneric" }).formatToParts(new Date()).find((p) => p.type === "timeZoneName")?.value || ""; } catch {}
    const city = z.split("/").pop().replace(/_/g, " ");
    return generic && !generic.startsWith("GMT") ? `${generic} (${city})` : city;
  };
  let clock24 = false;
  try { clock24 = localStorage.getItem("bk_clock") === "24"; } catch {}

  let turnstileReady = null;
  function loadTurnstile() {
    turnstileReady ||= new Promise((resolve) => {
      if (window.turnstile) return resolve(window.turnstile);
      window.__bkTurnstile = () => resolve(window.turnstile);
      const s = document.createElement("script");
      s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__bkTurnstile";
      s.async = true;
      document.head.appendChild(s);
    });
    return turnstileReady;
  }
  const track = (name) => { try { window.fathom?.trackEvent(name); } catch {} };

  const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
  const pathParts = location.pathname.replace(/\/+$/, "").split("/").slice(2);
  const query = new URLSearchParams(location.search);

  const skel = (n, cls) => Array.from({ length: n }, () => `<span class="bk-sk ${cls}"></span>`).join("");
  document.querySelectorAll(".bk").forEach((root) => {
    root.querySelector('[data-el="days"]').innerHTML = skel(35, "bk-sk-d");
    root.querySelector('[data-el="times"]').innerHTML = skel(12, "bk-sk-t");
    initBooking(root);
  });

  function initBooking(root) {
    const API = (isLocal && query.get("api")) || root.dataset.api;
    const $ = (name) => root.querySelector(`[data-el="${name}"]`);
    const step = (name) => root.querySelectorAll("[data-step]").forEach((s) => (s.hidden = s.dataset.step !== name));

    const route = pathParts[0] === "l" ? { link: pathParts[1] } : pathParts[0] === "manage" ? { manage: pathParts[1] }
      : { type: pathParts[0] || query.get("type") || "" };

    let info;
    let tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "America/New_York";

    // In-person types show times where the meeting happens, Mark's time zone, with no picker.
    function applyTzLock() {
      const locked = !!info.lockTimezone;
      $("tzlock").hidden = !locked; $("tzpicker").hidden = locked;
      if (locked) {
        tz = info.timezone;
        $("tzlock").textContent = `Times are in ${zoneName(tz)}, where we'll meet.`;
        fillTimezones();
      }
    }
    let duration = 0;
    let month = new Date();
    let byDay = new Map();
    let selectedDay = "";
    let chosen = [];
    let reschedule = null;
    let manageToken = "";
    let userMoved = false;
    let widgetId = null;

    const dayKey = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: tz });
    const timeLabel = (iso) => clock24
      ? new Date(iso).toLocaleTimeString("en-GB", { timeZone: tz, hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
      : new Date(iso).toLocaleTimeString("en-US", { timeZone: tz, hour: "numeric", minute: "2-digit" }).toLowerCase().replace(" ", "");
    const longDay = (iso) => new Date(iso).toLocaleDateString("en-US", { timeZone: tz, weekday: "long", month: "long", day: "numeric" });
    const fullWhen = (iso) => `${longDay(iso)}, ${timeLabel(iso)}`;
    const lengthLabel = (m) => (m % 60 === 0 ? `${m / 60} hr` : m > 60 ? `${Math.floor(m / 60)} hr ${m % 60} min` : `${m} min`);
    const monthKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    const lastBookable = () => new Date(Date.now() + info.rangeDays * 86_400_000);
    const atLastMonth = () => monthKey(month) >= monthKey(lastBookable());

    async function api(path, init) {
      const r = await fetch(API + path, init);
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(body.error || "Something went wrong."), { status: r.status });
      return body;
    }

    function missing(title, text) {
      root.classList.remove("is-loading");
      if (title) $("missing-title").textContent = title;
      if (text) $("missing-text").innerHTML = text;
      step("missing");
    }

    function fillTimezones() {
      const sel = $("tz");
      const nowIn = (z) => clock24
        ? new Date().toLocaleTimeString("en-GB", { timeZone: z, hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
        : new Date().toLocaleTimeString("en-US", { timeZone: z, hour: "numeric", minute: "2-digit" }).toLowerCase().replace(" ", "");
      const opt = (z) => `<option value="${z}">${zoneName(z)} · ${nowIn(z)}</option>`;
      const listed = ZONE_GROUPS.some(([, zs]) => zs.includes(tz));
      sel.innerHTML = (listed ? "" : `<optgroup label="Your time zone">${opt(tz)}</optgroup>`) +
        ZONE_GROUPS.map(([g, zs]) => `<optgroup label="${g}">${zs.map(opt).join("")}</optgroup>`).join("");
      sel.value = tz;
      const showTz = () => { $("tzlabel").textContent = sel.options[sel.selectedIndex]?.text || tz; };
      showTz();
      sel.onchange = () => { tz = sel.value; showTz(); groupSlots(); renderMonth(); renderTimes(); renderTray(); };
      root.querySelectorAll("[data-clock]").forEach((b) => b.classList.toggle("is-on", (b.dataset.clock === "24") === clock24));
    }

    let slots = [];
    const loaded = new Set();

    async function loadMonth() {
      const key = `${monthKey(month)}-${duration}`;
      if (!loaded.has(key)) {
        const from = new Date(Math.max(Date.now(), new Date(month.getFullYear(), month.getMonth(), 1).getTime() - 86_400_000));
        const to = new Date(month.getFullYear(), month.getMonth() + 1, 2);
        const q = new URLSearchParams({ duration: String(duration), from: from.toISOString(), to: to.toISOString() });
        if (reschedule) q.set("manage", manageToken);
        else if (info.token) q.set("link", info.token); else q.set("type", info.slug);
        try {
          const out = await api(`/slots?${q}`);
          const seen = new Set(slots.map((s) => s.start));
          slots.push(...out.slots.filter((s) => !seen.has(s.start)));
          loaded.add(key);
        } catch (e) {
          root.classList.remove("is-loading");
          $("status").textContent = e.message;
          return;
        }
        groupSlots();
      }
      root.classList.remove("is-loading");
      // Nobody should land on an empty month: until the visitor moves the calendar themselves, it
      // walks forward to the first month with an open time.
      if (!userMoved && !openInMonth() && !atLastMonth()) {
        month = new Date(month.getFullYear(), month.getMonth() + 1, 1);
        return loadMonth();
      }
      $("status").textContent = openInMonth() ? ""
        : userMoved ? `No open times in ${month.toLocaleDateString("en-US", { month: "long" })}.`
        : `No open times in the next ${info.rangeDays} days.`;
      renderMonth();
    }

    const openInMonth = () => [...byDay.keys()].some((k) => k.startsWith(monthKey(month)));

    function groupSlots() {
      byDay = new Map();
      for (const s of slots) {
        const taken = chosen.some((c) => Date.parse(s.start) < Date.parse(c.start) + c.duration * 60_000 && Date.parse(s.start) + duration * 60_000 > Date.parse(c.start));
        if (taken) continue;
        const k = dayKey(s.start);
        if (!byDay.has(k)) byDay.set(k, []);
        byDay.get(k).push(s);
      }
    }

    function renderMonth() {
      $("month").textContent = month.toLocaleDateString("en-US", { month: "long", year: "numeric" });
      const first = new Date(month.getFullYear(), month.getMonth(), 1);
      const days = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
      const cells = Array(first.getDay()).fill("<span></span>");
      const today = new Date().toLocaleDateString("en-CA", { timeZone: tz });
      for (let d = 1; d <= days; d++) {
        const k = `${monthKey(month)}-${String(d).padStart(2, "0")}`;
        const open = byDay.has(k);
        cells.push(`<button type="button" class="bk-d${open ? " is-open" : ""}${k === selectedDay ? " is-sel" : ""}${k === today ? " is-today" : ""}" data-day="${k}" ${open ? "" : "disabled"}>${d}</button>`);
      }
      $("days").innerHTML = cells.join("");
      root.querySelector('[data-act="prev"]').disabled = monthKey(month) <= monthKey(new Date());
      root.querySelector('[data-act="next"]').disabled = atLastMonth();
      if (!selectedDay.startsWith(monthKey(month))) {
        const firstOpen = [...byDay.keys()].sort().find((k) => k.startsWith(monthKey(month)));
        selectedDay = firstOpen || "";
        if (firstOpen) renderMonth();
        renderTimes();
      }
    }

    function renderTimes() {
      const list = byDay.get(selectedDay) || [];
      $("times-wrap").hidden = !selectedDay;
      if (!selectedDay) return;
      $("day").textContent = list[0] ? longDay(list[0].start) : "";
      $("times").innerHTML = list.map((s) => `<button type="button" class="bk-time" data-start="${s.start}">${timeLabel(s.start)}</button>`).join("")
        || `<p class="bk-status">No times left this day.</p>`;
    }

    function renderTray() {
      $("tray").hidden = !info.multi || !chosen.length;
      $("tray-list").innerHTML = chosen.map((c, i) => `<div class="bk-chip"><span>${fullWhen(c.start)} &middot; ${lengthLabel(c.duration)}</span><button type="button" data-remove="${i}" aria-label="Remove">&times;</button></div>`).join("");
      renderLeft();
    }

    function renderLeft() {
      if (info.minutesLeft == null) return;
      const used = chosen.reduce((n, c) => n + c.duration, 0);
      $("left").hidden = false;
      $("left").textContent = `${lengthLabel(info.minutesLeft - used)} left to book`;
    }

    function renderDurations() {
      const allowed = info.minutesLeft == null ? info.durations
        : info.durations.filter((d) => d <= info.minutesLeft - chosen.reduce((n, c) => n + c.duration, 0));
      const wrap = $("durations");
      wrap.hidden = allowed.length < 2;
      wrap.innerHTML = allowed.map((d) => `<button type="button" class="bk-dur${d === duration ? " is-sel" : ""}" data-dur="${d}">${lengthLabel(d)}</button>`).join("");
      if (!allowed.includes(duration) && allowed.length) setDuration(allowed[0]);
    }

    function setDuration(d) {
      duration = d;
      $("duration").hidden = false;
      $("duration").textContent = info.minutesLeft == null && info.durations.length > 1 ? info.durations.map(lengthLabel).join(", ") : lengthLabel(d);
      slots = []; loaded.clear(); selectedDay = "";
      renderDurations();
      loadMonth();
    }

    function pickTime(btn) {
      root.querySelectorAll(".bk-time.is-armed").forEach((b) => b.classList.remove("is-armed"));
      root.querySelectorAll(".bk-next").forEach((n) => n.remove());
      btn.classList.add("is-armed");
      const rowEnd = [...root.querySelectorAll(".bk-time")].filter((b) => b.offsetTop === btn.offsetTop).pop();
      const next = document.createElement("button");
      next.type = "button";
      next.className = "bk-next";
      next.textContent = `${info.multi && !reschedule ? "Add" : "Select"} ${timeLabel(btn.dataset.start)} →`;
      next.onclick = () => confirmTime(btn.dataset.start);
      rowEnd.after(next);
    }

    async function confirmTime(start) {
      if (reschedule) return doReschedule(start);
      chosen.push({ start, duration });
      if (!info.multi) return toDetails();
      const used = chosen.reduce((n, c) => n + c.duration, 0);
      const room = info.minutesLeft == null ? Infinity : info.minutesLeft - used;
      groupSlots(); renderTray(); renderTimes(); renderMonth();
      if (chosen.length >= info.sessionsLeft || room < Math.min(...info.durations)) return toDetails();
      renderDurations();
    }

    async function toDetails() {
      const picked = $("picked");
      picked.hidden = false;
      picked.innerHTML = chosen.map((c) => `<p>${fullWhen(c.start)}<br><span>${lengthLabel(c.duration)}</span></p>`).join("");
      step("details");
      root.scrollIntoView({ behavior: "smooth", block: "start" });
      if (root.dataset.sitekey && widgetId == null) {
        const ts = await loadTurnstile();
        widgetId = ts.render($("turnstile"), { sitekey: root.dataset.sitekey, theme: "dark" });
      }
    }

    function renderQuestions() {
      const attr = (s) => String(s).replace(/"/g, "&quot;");
      $("questions").innerHTML = info.questions.map((q) => {
        const req = q.required ? " *" : "";
        const name = `q_${q.id}`;
        const ph = q.placeholder ? ` placeholder="${attr(q.placeholder)}"` : "";
        if (q.kind === "textarea") return `<label class="bk-field"><span>${q.label}${req}</span><textarea name="${name}" rows="4"${ph} ${q.required ? "required" : ""}></textarea></label>`;
        if (q.kind === "select") return `<label class="bk-field"><span>${q.label}${req}</span><select name="${name}" ${q.required ? "required" : ""}><option value="">Pick one</option>${(q.options || []).map((o) => `<option>${o}</option>`).join("")}</select></label>`;
        return `<label class="bk-field"><span>${q.label}${req}</span><input name="${name}" type="${q.kind === "tel" ? "tel" : "text"}"${ph} ${q.required ? "required" : ""} /></label>`;
      }).join("");
    }

    async function submit(form) {
      const data = new FormData(form);
      const err = $("error");
      err.hidden = true;
      const answers = {};
      for (const q of info.questions) answers[q.id] = String(data.get(`q_${q.id}`) || "");
      const first = String(data.get("first") || "").trim(), last = String(data.get("last") || "").trim();
      data.set("name", `${first} ${last}`.trim());
      const missingFields = [!first && "your first name", !last && "your last name", !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(data.get("email"))) && "a valid email",
        ...info.questions.filter((q) => q.required && !answers[q.id].trim()).map((q) => q.label)].filter(Boolean);
      if (missingFields.length) { err.textContent = `Please add ${missingFields.join(", ")}.`; err.hidden = false; return; }
      const ts = window.turnstile;
      const btn = $("submit");
      btn.disabled = true; btn.textContent = "Booking…";
      try {
        await api("/book", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({
          type: info.token ? undefined : info.slug, link: info.token || undefined, sessions: chosen,
          name: data.get("name"), email: data.get("email"), answers, timezone: tz, website: data.get("website"),
          turnstile: ts && widgetId != null ? ts.getResponse(widgetId) : "",
        }) });
        $("done-email").textContent = String(data.get("email"));
        if (info.doneText) $("done-text").textContent = info.doneText;
        $("done-list").innerHTML = chosen.map((c) => `<li>${fullWhen(c.start)} &middot; ${lengthLabel(c.duration)}</li>`).join("");
        step("done");
        track("Booked " + info.name);
      } catch (e) {
        err.textContent = e.message; err.hidden = false;
        if (ts && widgetId != null) ts.reset(widgetId);
        if (e.status === 409) { chosen = []; slots = []; loaded.clear(); selectedDay = ""; renderTray(); }
      } finally {
        btn.disabled = false; btn.textContent = info.cta || "Confirm booking";
      }
    }

    async function loadManage(token) {
      manageToken = token;
      const m = await api(`/manage/${token}`).catch(() => null);
      if (!m) return missing();
      info = m.info;
      showInfo();
      root.classList.remove("is-loading");
      step("manage");
      $("manage-list").innerHTML = m.sessions.map((s) => `<li class="bk-mrow">
        <span>${fullWhen(s.start)} &middot; ${lengthLabel(s.duration)}${s.status === "cancelled" ? " (cancelled)" : ""}</span>
        ${s.canChange ? `<span class="bk-mact"><button type="button" class="bk-link" data-resched="${s.id}" data-dur="${s.duration}">Reschedule</button>${s.canCancel ? `<button type="button" class="bk-link" data-cancel="${s.id}">Cancel</button>` : ""}</span>` : ""}
      </li>`).join("");
      if (m.sessions.some((s) => s.status === "confirmed" && !s.canChange)) $("manage-status").textContent = `Within ${m.cutoffHours} hours of a session, reply to your confirmation email to change it.`;
    }

    async function doReschedule(start) {
      try {
        await api(`/manage/${manageToken}/reschedule`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: reschedule.id, start }) });
        reschedule = null;
        await loadManage(manageToken);
        $("manage-status").textContent = `Moved to ${fullWhen(start)}. An updated invite is on its way.`;
      } catch (e) { $("status").textContent = e.message; }
    }

    // Descriptions come from Calendly as plain text: "- " lines are lists, and a short line with no
    // closing punctuation is a heading. Everything is escaped first.
    function descHtml(text) {
      const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      return text.split(/\n\s*\n/).map((block) => {
        const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
        if (!lines.length) return "";
        if (lines.every((l) => l.startsWith("- "))) return `<ul>${lines.map((l) => `<li>${esc(l.slice(2))}</li>`).join("")}</ul>`;
        if (lines.length === 1 && lines[0].length <= 48 && !/[.:!?,;]$/.test(lines[0])) return `<h3>${esc(lines[0])}</h3>`;
        return `<p>${lines.map(esc).join("<br>")}</p>`;
      }).join("");
    }

    async function showList() {
      // Card placeholders, not the calendar, while the list loads.
      $("title").textContent = "Book a time";
      step("list");
      const out = await api("/types?entity=motive11").catch(() => null);
      if (!out?.types?.length) {
        return missing("Looking to work with me?", `Everything starts at <a href="https://markszymanski.co/work-with-me">markszymanski.co</a>. If I sent you a booking link, use that one.`);
      }
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const blurb = (d) => { const p = (d || "").split(/\n\s*\n/)[0].replace(/\s+/g, " ").trim(); return p.length > 170 ? p.slice(0, 167).trimEnd() + "…" : p; };
      $("title").textContent = "Book a time";
      $("types").innerHTML = out.types.map((t) => `<li><a class="bk-type" href="/book/${encodeURIComponent(t.slug)}">
        <span class="bk-type-name">${esc(t.name)}</span>
        <span class="bk-type-meta">${t.durations.map(lengthLabel).join(", ")}${t.location ? ` · ${esc(t.location)}` : ""}</span>
        ${blurb(t.description) ? `<span class="bk-type-desc">${esc(blurb(t.description))}</span>` : ""}
      </a></li>`).join("");
      root.classList.remove("is-loading");
      step("list");
    }

    function showInfo() {
      applyTzLock();
      $("title").textContent = info.label || info.name;
      $("desc").innerHTML = descHtml(info.description || "");
      if (info.location) { $("location").hidden = false; $("location").textContent = info.location; }
      if (info.footnote) { $("footnote").hidden = false; $("footnote").textContent = info.footnote; }
      if (info.cta) $("submit").textContent = info.cta;
      if (info.doneTitle) $("done-title").textContent = info.doneTitle;
      document.title = `${info.name}, Motive11`;
    }

    root.addEventListener("click", async (e) => {
      const t = e.target;
      const day = t.closest("[data-day]");
      if (day) {
        selectedDay = day.dataset.day;
        root.querySelectorAll(".bk-d.is-sel").forEach((d) => d.classList.remove("is-sel"));
        day.classList.add("is-sel");
        renderTimes(); return;
      }
      const time = t.closest(".bk-time");
      if (time) return pickTime(time);
      const clk = t.closest("[data-clock]");
      if (clk) {
        clock24 = clk.dataset.clock === "24";
        try { localStorage.setItem("bk_clock", clock24 ? "24" : "12"); } catch {}
        fillTimezones(); renderTimes(); renderTray();
        return;
      }
      const dur = t.closest(".bk-dur");
      if (dur) return setDuration(Number(dur.dataset.dur));
      const act = t.closest("[data-act]")?.dataset.act;
      if (act === "prev" || act === "next") {
        userMoved = true;
        month = new Date(month.getFullYear(), month.getMonth() + (act === "next" ? 1 : -1), 1);
        selectedDay = ""; $("times-wrap").hidden = true;
        return loadMonth();
      }
      if (act === "back") { if (!info.multi) chosen = []; $("picked").hidden = true; groupSlots(); renderTray(); renderMonth(); renderTimes(); return step("pick"); }
      if (act === "to-details") return toDetails();
      const rm = t.closest("[data-remove]");
      if (rm) { chosen.splice(Number(rm.dataset.remove), 1); groupSlots(); renderTray(); renderDurations(); renderMonth(); renderTimes(); return; }
      const cancel = t.closest("[data-cancel]");
      if (cancel) {
        if (cancel.dataset.confirm !== "1") { cancel.dataset.confirm = "1"; cancel.textContent = "Yes, cancel it"; return; }
        try { await api(`/manage/${manageToken}/cancel`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: cancel.dataset.cancel }) }); await loadManage(manageToken); $("manage-status").textContent = "Cancelled. The calendar invite has been removed."; }
        catch (err) { $("manage-status").textContent = err.message; }
        return;
      }
      const rs = t.closest("[data-resched]");
      if (rs) {
        reschedule = { id: rs.dataset.resched };
        info = { ...info, durations: [Number(rs.dataset.dur)], minutesLeft: null, multi: false, sessionsLeft: 1 };
        step("pick");
        setDuration(Number(rs.dataset.dur));
      }
    });
    root.querySelector("form").addEventListener("submit", (e) => { e.preventDefault(); submit(e.target); });

    (async () => {
      fillTimezones();
      if ("manage" in route) return loadManage(route.manage);
      if (!route.type && !("link" in route)) return showList();
      const path = "link" in route ? `/l/${route.link}` : `/t/${route.type}`;
      info = await api(path).catch(() => null);
      // Szymanski Media types book on markszymanski.co, so a Motive11 page never offers one.
      if (!info || info.entity !== "motive11") return missing();
      if (info.price) return missing("Booking for this opens soon.", "Reply to the email that sent you here and I'll get you a time.");
      if (!info.sessionsLeft) return missing();
      showInfo();
      renderQuestions();
      step("pick");
      setDuration(info.durations[0]);
    })();
  }
})();
</script>

</body>
</html>
